name: Sync map data and deploy

# The world map reads landmask.png, borders.png and cities.js, all generated from the
# Avium Map (auroruse/avium-map) by scripts/sync-map.mjs. This checks the Map every
# 15 minutes, commits the files when anything changed, and deploys Pages. A push here
# deploys too.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: auroruse/avium-map
          path: map
          sparse-checkout: |
            public/landmask.png
            public/tiles/borders/5
            src/data/coordinates.tsv
            src/data/cities.tsv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/sync-map.mjs map
      - id: commit
        run: |
          git add landmask.png borders.png cities.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync map data from avium-map"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: github.event_name != 'schedule' || needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: mkdir site && cp index.html cities.js logo.png landmask.png borders.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
